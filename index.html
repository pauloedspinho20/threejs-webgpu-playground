<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>threejs-webgpu-playground</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Solway:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cutive+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Prevent Flash of Unstyled Content (FOUC) and hide scrollbars */
      body {
        margin: 0;
        overflow: hidden;
        background-color: #ffffff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #loading-screen {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: rgba(255, 255, 255, 0.95);
      }
    </style>
  </head>

  <body>
    <!-- Loading screen (visible by default; toggled by the app on load events) -->
    <div id="loading-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-background/95 backdrop-blur-sm transition-opacity duration-300">
      <h1 class="text-3xl font-bold tracking-tight text-foreground mb-8">threejs-webgpu-playground</h1>
      
      <div class="w-full max-w-sm flex flex-col gap-2">
        <div class="flex justify-between items-center text-sm font-medium text-muted-foreground">
          <span id="loading-text">Loading...</span>
          <span id="loading-percentage">0%</span>
        </div>
        <div class="h-2 w-full overflow-hidden rounded-full bg-secondary">
          <div id="loading-bar" class="h-full bg-primary transition-all duration-300 ease-out" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- In-world UI chrome (hidden until the world is ready) -->
    <div
      id="ui-container"
      class="absolute inset-0 pointer-events-none"
      style="display: none"
    >
      <div
        class="pointer-events-auto absolute left-4 bottom-4 w-auto max-w-[320px] backdrop-blur-md rounded-xl shadow-lg overflow-hidden transition-all duration-300"
      >
        <div
          id="controls"
          class="p-4 text-sm text-card-foreground flex flex-col gap-2"
        ></div>
      </div>
    </div>

    <script type="module" src="/src/ts/app/main.ts"></script>
  </body>
</html>
